<!doctype html>
<!-- data-theme default kept in sync with DEFAULT_THEME_ID in src/lib/data/themes.ts -->
<html lang="en" data-theme="system">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="A catalog of AI coding skills for AI-assisted software engineering, testing, cloud platforms, databases, and more." />
		<link rel="stylesheet" id="lily-theme" data-lily-theme-picker="theme" href="/themes/system.css" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<script>
			// Apply the stored theme (a cookie) and text-size choices before first
			// paint, so returning visitors never see a flash of the wrong
			// theme or scale. Mirrors the theme and text-size pickers in
			// Header.svelte (Lily's picker-bar) — both persist a slug, not a
			// computed value, so this script only ever sets data-* attributes,
			// never CSS values
			// directly (theme.css maps data-text-size to --user-font-scale).
			(function () {
				try {
					var theme = (document.cookie.match(/(?:^|; )skills-on-ai-theme=([a-z0-9-]+)/) || [])[1];
					if (theme) {
						document.documentElement.dataset.theme = theme;
						var link = document.getElementById('lily-theme');
						if (link) link.href = '/themes/' + theme + '.css';
					}
					var textSize = localStorage.getItem('skills-on-ai-text-size');
					if (textSize) {
						document.documentElement.dataset.textSize = textSize;
					}
				} catch (e) {
					// localStorage unavailable (private browsing, disabled storage) — ignore.
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
